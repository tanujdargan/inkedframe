<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo frame</title>
<style>
  body { font: 18px system-ui, sans-serif; margin: 0 auto; padding: 24px 16px; max-width: 520px; text-align: center; color: #222; background: #faf8f4; }
  h1 { font-size: 26px; margin: 8px 0 24px; }
  .btn { display: block; padding: 20px; border-radius: 14px; background: #222; color: #fff; font-size: 20px; cursor: pointer; }
  .btn:focus-within { outline: 3px solid #2157ba; outline-offset: 3px; }
  fieldset { border: 0; padding: 0; margin: 0 0 20px; text-align: left; font-size: 16px; color: #555; }
  legend { padding: 0; margin-bottom: 6px; }
  #look > label { display: inline-block; margin: 0 14px 10px 0; color: #222; font-size: 18px; }
  #look #inkrow { display: none; width: 100%; margin: 0; color: #555; font-size: 16px; }
  #look:has([value=duotone]:checked) #inkrow { display: block; }
  #pinbox, #capbox { margin: 0 0 20px; }
  #pinbox label, #capbox label { display: block; margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { margin: 4px 0; }
  #pick { position: absolute; opacity: 0; width: 1px; height: 1px; }
  canvas { width: 100%; height: auto; border-radius: 8px; margin-top: 20px; display: none; }
  #msg { min-height: 1.5em; margin: 20px 0 0; }
  #info { color: #777; font-size: 14px; margin-top: 28px; }
  form { text-align: left; margin-top: 36px; }
  h2 { font-size: 20px; margin: 0 0 8px; }
  form label { display: block; margin-top: 14px; font-size: 16px; color: #555; }
  select, input:not([type]) { display: block; box-sizing: border-box; width: 100%; margin-top: 4px; padding: 10px; font: inherit; font-size: 18px; color: #222; background: #fff; border: 1px solid #bbb; border-radius: 10px; }
  button.btn { width: 100%; margin-top: 20px; border: 0; font: inherit; font-size: 20px; }
  #saved { min-height: 1.5em; margin: 12px 0 0; text-align: center; }
  details { text-align: left; margin-top: 36px; color: #555; font-size: 16px; }
  summary { cursor: pointer; padding: 6px 0; }
  .ph { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-items: center; margin-top: 16px; }
  .ph canvas { display: block; margin: 0; grid-row: span 3; }
  .ph button { font: inherit; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid #bbb; background: #fff; color: #222; }
  .ph label { grid-column: 2; }
  input[type=checkbox], input[type=radio] { width: 22px; height: 22px; vertical-align: middle; }
</style>
<h1>Photo frame</h1>
<fieldset id="look">
  <legend>Look</legend>
  <label><input type="radio" name="treat" value="natural" checked> Natural</label>
  <label><input type="radio" name="treat" value="poster"> Poster</label>
  <label><input type="radio" name="treat" value="duotone"> Duotone</label>
  <label id="inkrow" for="ink">Duotone colour
    <select id="ink"><option value="">Automatic</option><option value="3">Red</option><option value="4">Blue</option><option value="2">Yellow</option><option value="5">Green</option></select>
  </label>
</fieldset>
<details id="pinbox">
  <summary>Show on a date (optional)</summary>
  <p class="hint">Shown on this day every year instead of the usual picture.</p>
  <div class="two">
    <label>Month <select id="month"><option value="">–</option></select></label>
    <label>Day <select id="day"><option value="">–</option></select></label>
  </div>
  <label>Greeting on the photo <input id="greet" maxlength="40" placeholder="Happy birthday!"></label>
</details>
<details id="capbox">
  <summary>Add a caption (optional)</summary>
  <label>Message <input id="note" maxlength="60"></label>
  <label>From <input id="from" maxlength="30"></label>
</details>
<label class="btn">Choose photos<input id="pick" type="file" accept="image/*" multiple></label>
<p id="msg" role="status" aria-live="polite"></p>
<canvas id="view" width="800" height="480" aria-label="Preview of the photo as the frame will show it"></canvas>
<form id="settings">
  <h2>Settings</h2>
  <label for="show">Show</label>
  <select id="show" name="show"><option value="0">My photos</option><option value="1">Artwork</option><option value="2">Today</option></select>
  <label for="src">Artwork</label>
  <select id="src" name="src"><option value="0">Museum art</option><option value="1">Random photos</option></select>
  <label for="date">Date on the picture</label>
  <select id="date" name="date"><option value="0">Off</option><option value="1">Corner</option><option value="2">Banner</option><option value="3">Big</option></select>
  <label for="tz">Time zone</label>
  <select id="tz" name="tz"><option value="auto">Automatic</option></select>
  <label for="key">Unsplash access key (optional, for Random photos)</label>
  <input id="key" name="key" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="btn">Save</button>
  <p id="saved" role="status" aria-live="polite"></p>
</form>
<p id="info"></p>
<details id="photos">
  <summary>Photos on the frame</summary>
  <div id="list"></div>
</details>
<details>
  <summary>Advanced</summary>
  <p>Firmware version: <span id="ver"></span></p>
  <button class="btn" id="update" type="button">Update firmware</button>
  <p id="upmsg" role="status" aria-live="polite"></p>
</details>
<script>
const W = 800, H = 480;
// Approximate measured Spectra 6 ink colours, in the order the frame expects:
// black, white, yellow, red, blue, green. Tune here if a colour looks off on the panel.
const PALETTE = [[25,30,33],[232,232,232],[239,222,68],[178,19,24],[33,87,186],[53,120,70]];
const SATURATION = 1.4, CONTRAST = 1.15;

// DITHER-BEGIN (tools/test_dither.mjs runs this block under node)
const lum = c => 0.299*c[0] + 0.587*c[1] + 0.114*c[2];
// RGBA pixels (W*H*4) -> palette index per pixel (W*H), Floyd-Steinberg.
// Treatments: 'natural'; 'poster' carries less error, for flatter colour fields; 'duotone' maps
// brightness to black, the palette index ink, and white.
function dither(rgba, treat = 'natural', ink = 3) {
  const a = new Float32Array(W * H * 3), duo = treat == 'duotone', carry = treat == 'poster' ? 0.4 : 1;
  const inks = duo ? [0, ink, 1] : [0, 1, 2, 3, 4, 5];
  let mean = 0;
  for (let i = 0; i < W * H; i++) {
    const r = rgba[i*4], g = rgba[i*4+1], b = rgba[i*4+2];
    const grey = 0.299*r + 0.587*g + 0.114*b;
    a[i*3]   = Math.min(255, Math.max(0, grey + (r - grey) * SATURATION));
    a[i*3+1] = Math.min(255, Math.max(0, grey + (g - grey) * SATURATION));
    a[i*3+2] = Math.min(255, Math.max(0, grey + (b - grey) * SATURATION));
    mean += 0.299*a[i*3] + 0.587*a[i*3+1] + 0.114*a[i*3+2];
  }
  mean /= W * H;
  for (let i = 0; i < a.length; i++) a[i] = Math.min(255, Math.max(0, mean + (a[i] - mean) * CONTRAST));
  if (duo) {
    const [k, m, w] = inks.map(p => PALETTE[p]), lk = lum(k), lm = lum(m), lw = lum(w);
    for (let i = 0; i < a.length; i += 3) {
      const g = lum(a.subarray(i, i + 3)), lo = g < lm, t = lo ? (g - lk) / (lm - lk) : (g - lm) / (lw - lm);
      const u = Math.min(1, Math.max(0, t)), p = lo ? k : m, q = lo ? m : w;
      for (let c = 0; c < 3; c++) a[i + c] = p[c] + (q[c] - p[c]) * u;
    }
  }
  const out = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 3;
    let best = 0, bestD = Infinity;
    for (const p of inks) {
      const d = (a[i]-PALETTE[p][0])**2 + (a[i+1]-PALETTE[p][1])**2 + (a[i+2]-PALETTE[p][2])**2;
      if (d < bestD) { bestD = d; best = p; }
    }
    out[y * W + x] = best;
    for (let c = 0; c < 3; c++) {
      const e = (a[i+c] - PALETTE[best][c]) * carry;
      if (x + 1 < W) a[i + 3 + c] += e * 7/16;
      if (y + 1 < H) {
        if (x > 0) a[i + (W-1)*3 + c] += e * 3/16;
        a[i + W*3 + c] += e * 5/16;
        if (x + 1 < W) a[i + (W+1)*3 + c] += e * 1/16;
      }
    }
  }
  return out;
}
// The ink (yellow 2, red 3, blue 4, green 5) nearest in hue to the photo's colourful pixels.
function dominantInk(rgba) {
  const hues = { 3: 0, 2: 55, 5: 140, 4: 220 }, score = { 2: 0, 3: 0, 4: 0, 5: 0 };
  for (let i = 0; i < rgba.length; i += 16) {
    const r = rgba[i], g = rgba[i+1], b = rgba[i+2], max = Math.max(r, g, b), d = max - Math.min(r, g, b);
    if (max < 50 || d < 0.25 * max) continue;  // dark or greyish
    const h = (max == r ? (g - b) / d + 6 : max == g ? (b - r) / d + 2 : (r - g) / d + 4) * 60 % 360;
    let best = 3, bd = 999;
    for (const p in hues) { const x = Math.abs(h - hues[p]), dd = Math.min(x, 360 - x); if (dd < bd) { bd = dd; best = p; } }
    score[best] += d / max;
  }
  return +Object.keys(score).reduce((x, y) => score[y] > score[x] ? y : x);
}
// Text drawn after dithering stays crisp: idx becomes ink wherever the rendered text (rgba) is solid.
function stamp(idx, rgba, ink) {
  for (let i = 0; i < idx.length; i++) if (rgba[i * 4 + 3] >= 128) idx[i] = ink;
}
// Three pixels per byte, first pixel most significant: a*36 + b*6 + c.
function pack(idx) {
  const out = new Uint8Array(idx.length / 3);
  for (let i = 0; i < out.length; i++) out[i] = idx[i*3] * 36 + idx[i*3+1] * 6 + idx[i*3+2];
  return out;
}
// DITHER-END

const msg = document.getElementById('msg'), view = document.getElementById('view'), pick = document.getElementById('pick');
const ASLEEP = 'The frame has gone to sleep. Press the button on the frame, then reload this page.';
const ctx = view.getContext('2d', { willReadFrequently: true });

const look = document.getElementById('look'), ink = document.getElementById('ink');
const treat = () => look.querySelector(':checked').value;
try {
  const [t, k] = localStorage.getItem('look').split(',');
  look.querySelector(`[value=${t}]`).checked = true;
  ink.value = k;
} catch (e) {}
look.onchange = () => { try { localStorage.setItem('look', treat() + ',' + ink.value); } catch (e) {} };

const month = document.getElementById('month'), day = document.getElementById('day'), greet = document.getElementById('greet');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
MONTHS.forEach((m, i) => month.add(new Option(m, i + 1)));
for (let d = 1; d <= 31; d++) day.add(new Option(d, d));

// The greeting (red) and caption (black) go in a white band across the top, drawn after dithering.
function band(idx) {
  const v = id => document.getElementById(id).value.trim(), from = v('from');
  const lines = [[v('greet'), 'bold', 56, 3], [v('note'), '', 36, 0], [from && '– ' + from, 'italic', 30, 0]].filter(l => l[0]);
  if (!lines.length) return;
  const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
  c.width = W; c.height = H;
  x.textAlign = 'center'; x.textBaseline = 'top';
  const font = (style, size) => x.font = `${style} ${size}px system-ui, -apple-system, sans-serif`;
  for (const l of lines) while (font(l[1], l[2]), x.measureText(l[0]).width > W - 60 && l[2] > 12) l[2]--;
  let y = 24;
  idx.fill(1, 0, (y + lines.reduce((h, l) => h + l[2] * 1.25, 0) + 12 | 0) * W);
  for (const [text, style, size, ink] of lines) {
    font(style, size);
    x.clearRect(0, 0, W, H);
    x.fillText(text, W / 2, y);
    stamp(idx, x.getImageData(0, 0, W, H).data, ink);
    y += size * 1.25 | 0;
  }
}

async function send(file) {
  // Photos from a phone camera are often stored sideways with an EXIF rotation tag.
  const img = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
  const s = Math.max(W / img.width, H / img.height), sw = W / s, sh = H / s;
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) * 0.45, sw, sh, 0, 0, W, H);  // fill the frame, crop the rest
  const px = ctx.getImageData(0, 0, W, H), t = treat();
  const idx = dither(px.data, t, +ink.value || dominantInk(px.data));
  band(idx);
  for (let i = 0; i < idx.length; i++) px.data.set(PALETTE[idx[i]], i * 4);
  ctx.putImageData(px, 0, 0);
  view.style.display = 'block';
  const form = new FormData();
  form.append('photo', new Blob([pack(idx)]), 'photo.bin');
  const pin = month.value && day.value ? `?pin=${month.value * 100 + +day.value}` : '';
  const r = await fetch('/upload' + pin, { method: 'POST', body: form });
  if (!r.ok) throw new Error(await r.text());
}

// Closing the page lets the frame finish at once. Not while uploading or in the photo picker: iPhone
// Safari can hide the page for the picker.
let busy = false, picking = false;
pick.onclick = () => picking = true;
pick.oncancel = () => picking = false;
addEventListener('pagehide', () => busy || picking || navigator.sendBeacon('/bye'));
addEventListener('pageshow', e => e.persisted && fetch('/status').catch(() => msg.textContent = ASLEEP));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState == 'visible' && !busy && !picking) fetch('/status').catch(() => msg.textContent = ASLEEP);
});

pick.onchange = async e => {
  const files = [...e.target.files];
  picking = false;
  busy = true;
  try {
    for (let i = 0; i < files.length; i++) {
      msg.textContent = `Sending photo ${i + 1} of ${files.length}…`;
      await send(files[i]);
    }
    msg.textContent = 'Sent. The frame takes about half a minute to change.';
  } catch (err) {
    msg.textContent = err.message == 'full' ? 'The frame is full of kept photos. Delete one under "Photos on the frame" first.'
      : 'That did not work. Press the button on the frame and try again.';
  }
  busy = false;
  e.target.value = '';
};

const form = document.getElementById('settings'), saved = document.getElementById('saved');
for (const m of [-720,-660,-600,-570,-540,-480,-420,-360,-300,-240,-210,-180,-120,-60,0,60,120,180,210,240,270,300,330,345,360,390,420,480,525,540,570,600,630,660,720,765,780,840]) {
  const a = Math.abs(m), t = `UTC${m < 0 ? '−' : '+'}${String(a / 60 | 0).padStart(2, '0')}:${String(a % 60).padStart(2, '0')}`;
  form.tz.add(new Option(t, m));
}
form.onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await fetch('/settings', { method: 'POST', body: new URLSearchParams(new FormData(form)) });
    if (!r.ok) throw 0;
    saved.textContent = 'Saved. The frame redraws in about a minute.';
  } catch (err) {
    saved.textContent = 'Not saved. Press the button on the frame and try again.';
  }
};

document.getElementById('update').onclick = async () => {
  const upmsg = document.getElementById('upmsg');
  if (!confirm('Restart the frame into update mode?')) return;
  try {
    const r = await fetch('/updater', { method: 'POST' });
    if (!r.ok) throw 0;
    upmsg.textContent = 'Restarting. In about half a minute, reload this page to choose the firmware file.';
  } catch (err) {
    upmsg.textContent = 'That did not work. Press the button on the frame and try again.';
  }
};

// Thumbnails: fetched one at a time when the section is opened (the frame serves one request at a time).
const list = document.getElementById('list'), photos = document.getElementById('photos');
let stored = [];
function unpack(bytes, px) {  // the reverse of pack(), into RGBA
  for (let i = 0; i < W * H; i++) {
    const b = bytes[i / 3 | 0], p = b > 215 ? 1 : [b / 36 | 0, (b / 6 | 0) % 6, b % 6][i % 3];
    px.set(PALETTE[p], i * 4);
    px[i * 4 + 3] = 255;
  }
}
async function act(seq, what) {
  const r = await fetch(`/photo?seq=${seq}&do=${what}`, { method: 'POST' });
  if (!r.ok) throw 0;
}
photos.ontoggle = async () => {
  if (!photos.open || list.childElementCount) return;
  if (!stored.length) list.textContent = 'No photos yet.';
  const full = document.createElement('canvas'), fctx = full.getContext('2d');
  full.width = W; full.height = H;
  const px = fctx.createImageData(W, H);
  for (const [seq, meta] of stored) {
    const row = document.createElement('div'), c = document.createElement('canvas');
    row.className = 'ph';
    c.width = 200; c.height = 120;
    c.setAttribute('aria-label', `Photo ${seq}`);
    const show = document.createElement('button'), del = document.createElement('button');
    show.textContent = 'Show now'; del.textContent = 'Delete';
    const keep = document.createElement('label');
    keep.innerHTML = '<input type="checkbox"> Keep';
    const box = keep.firstChild;
    box.checked = meta & 0x8000;
    const pin = meta & 0x7fff;
    if (pin) keep.textContent = `Shown on ${pin % 100} ${MONTHS[(pin / 100 | 0) - 1]}`;
    row.append(c, show, del, keep);
    list.append(row);
    show.onclick = () => act(seq, 'show').then(() => show.textContent = 'Shown when you close this page', () => show.textContent = 'Failed');
    del.onclick = () => confirm('Delete this photo from the frame?') && act(seq, 'delete').then(() => row.remove(), () => del.textContent = 'Failed');
    box.onchange = () => act(seq, box.checked ? 'keep' : 'unkeep').catch(() => box.checked = !box.checked);
    try {
      const r = await fetch(`/photo?seq=${seq}`);
      unpack(new Uint8Array(await r.arrayBuffer()), px.data);
      fctx.putImageData(px, 0, 0);
      c.getContext('2d').drawImage(full, 0, 0, 200, 120);
    } catch (e) { msg.textContent = ASLEEP; return; }
  }
};

fetch('/status').then(r => r.json()).then(s => {
  stored = s.list;
  document.getElementById('info').textContent =
    `${s.photos} of ${s.max} photos stored` + (s.battery_pct >= 0 ? ` · Battery ${Math.min(100, s.battery_pct)}%` : '');
  document.getElementById('ver').textContent = s.version;
  form.show.value = s.show; form.src.value = s.src; form.date.value = s.date; form.tz.value = s.tz; form.key.value = s.key;
}).catch(() => {});
</script>
</html>
