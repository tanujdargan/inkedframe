[env:feather]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s3
framework = arduino
lib_deps = zinggjm/GxEPD2@^1.6.0
board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/index.html
; USB_MODE=1: the chip's built-in USB serial stays reachable even if the app crashes
build_flags = -DARDUINO_USB_MODE=1 -DCORE_DEBUG_LEVEL=0
; shown on the page, to tell whether an update took
build_src_flags = !echo "-DFW_VERSION=\\\"$(git describe --always --dirty)-$(date +%%y%%m%%d.%%H%%M)\\\""
monitor_speed = 115200

; short rotation interval for bench testing
[env:dev]
extends = env:feather
build_flags = ${env:feather.build_flags} -DROTATE_SECONDS=60 -DSESSION_SECONDS=25

; bench only: every button/power-on wake forgets Wi-Fi, to test re-pairing without pressing anything
[env:forget]
extends = env:dev
build_flags = ${env:dev.build_flags} -DTEST_FORGET_WIFI

; the small app in the second slot that receives firmware updates (flash once over USB, see README)
[env:updater]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s3
framework = arduino
board_build.partitions = partitions.csv
board_build.app_partition_name = app1
board_upload.offset_address = 0x1C0000
build_src_filter = -<*> +<../updater/>
build_flags = -DARDUINO_USB_MODE=1 -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200

; bench only: production behaviour, but with the panel's BUSY wire "loose", to prove a redraw still completes
[env:loose]
extends = env:feather
build_flags = ${env:feather.build_flags} -DTEST_BUSY_LOOSE
