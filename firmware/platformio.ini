[env:feather]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s3
framework = arduino
lib_deps = zinggjm/GxEPD2@^1.6.0
board_build.partitions = partitions.csv
board_build.embed_txtfiles = src/index.html
; USB_MODE=1: the chip's built-in USB serial stays reachable even if the app crashes
build_flags = -DARDUINO_USB_MODE=1 -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200

; short rotation interval for bench testing
[env:dev]
extends = env:feather
build_flags = ${env:feather.build_flags} -DROTATE_SECONDS=60 -DSESSION_SECONDS=25
